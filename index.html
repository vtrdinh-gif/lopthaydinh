$('#v').innerHTML=`<div class=card><b>Thông tin lớp &amp; năm học</b><div class=row>${F('cls','Lớp')}${F('school','Đơn vị')}${F('place','Địa danh')}${F('gv','Họ tên GVCN')}${F('start','Ngày bắt đầu năm học (tuần 1)','date')}${F('w1','Số tuần HK1','number')}${F('w2','Số tuần HK2','number')}</div><small>Năm học ${c.w1+c.w2} tuần${c.start?` · HK1: ${vn(c.start)} → ${vn(c.hk1)} · HK2: ${vn(add(c.hk1,1))} → ${vn(c.hk2)}`:' (hãy chọn ngày bắt đầu năm học)'}</small></div>
<div class=card><b>Đồng bộ nhiều thiết bị (Firebase)</b><br><input id=fb style="width:100%" placeholder="https://ten-du-an-default-rtdb.firebaseio.com" value="${esc(FB)}"><div class=row style="margin-top:6px"><button onclick="FB=$('#fb').value.trim().replace(/\\/$/,'');localStorage.fb=FB;FB?base().then(pull):0;toast('Đã lưu và đồng bộ')">Lưu &amp; đồng bộ</button>${FB?`<button class=s onclick=showLink()>Tạo mã QR / link chia sẻ</button>`:''}</div></div>
<div class=card><b>Danh sách học sinh (${S.st.length})</b><div class=row><input type=file accept=".xlsx,.xls,.csv" onchange=imp(this)><button class=s onclick=addS()>+ Thêm học sinh</button><span class=row><input type=number id=nto min=1 max=10 value=4 style="width:60px"> tổ <button class=s onclick=auto()>Chia tổ tự động</button></span><button class=s onclick=codeList()>In danh sách mã đăng nhập</button></div><small>File Excel cần các cột: Họ và lót, Tên, Ngày sinh, Nữ.</small>
<div class=sc><table><tr><th>Họ tên<th>Tổ<th>Chức vụ<th>Mã đăng nhập đầu tiên<th>Khóa<th></tr>${S.st.map((s,i)=>`<tr><td>${esc(nm(s))}<td><input type=number min=1 style="width:55px" value="${s.to||''}" onchange="S.st[${i}].to=+this.value||'';save()"><td><select onchange="S.st[${i}].r=this.value;save()">${['','Lớp trưởng','Lớp phó học tập','Bí thư chi đoàn','Tổ trưởng','Tổ phó'].map(r=>`<option ${s.r==r?'selected':''}>${r}</option>`).join('')}</select><td>${S.pw[s.id]?`<small class=pos>✔ đã đổi</small> <button class=s onclick="reissue(${i})">Cấp lại mã</button>`:`<code>${esc(s.ic||'')}</code>`}<td><input type=checkbox ${s.lk?'checked':''} onchange="S.st[${i}].lk=this.checked;save()"><td><button class=x onclick="delS(${i})">✕</button></tr>`).join('')}</table></div></div>
<div class=card><b>Danh mục hành vi</b> <small>(cột “NT”: vi phạm nghiêm trọng → tháng đó tự động Chưa đạt)</small><div class=row><button class=s onclick="addC('-')">+ Điểm trừ</button><button class=s onclick="addC('+')">+ Điểm cộng</button></div>
<div class=sc><table><tr><th>Loại<th>Nội dung<th>Điểm<th>NT<th></tr>${S.cat.map((x,i)=>`<tr><td class="${x.t=='-'?'neg':'pos'}">${x.t=='-'?'Trừ':'Cộng'}<td><input style="width:300px" value="${esc(x.n)}" onchange="S.cat[${i}].n=this.value;save()"><td><input type=number style="width:60px" value="${x.p}" onchange="S.cat[${i}].p=Math.abs(+this.value);save()"><td>${x.t=='-'?`<input type=checkbox ${x.sev?'checked':''} onchange="S.cat[${i}].sev=this.checked?1:0;save()">`:''}<td><button class=x onclick="S.cat.splice(${i},1);save();vCD()">✕</button></tr>`).join('')}</table></div></div>`}
function delS(i){conf('Xóa học sinh '+esc(nm(S.st[i]))+'?',()=>{S.st.splice(i,1);save();vCD();toast('Đã xóa')})}
function addS(){form('Thêm học sinh',[['Họ và tên lót'],['Tên'],['Ngày sinh (dd/mm/yyyy)']],v=>{if(!v[1])return toast('Cần nhập tên');S.st.push({id:uid(),h:v[0],t:v[1],d:v[2],g:'',to:'',r:'',ic:gen()});save();vCD();toast('Đã thêm')})}
function addC(t){form(t=='-'?'Thêm hành vi điểm trừ':'Thêm hành vi điểm cộng',[['Nội dung hành vi'],['Số điểm (số dương)']],v=>{const p=Math.abs(+v[1]);if(!v[0]||!p)return toast('Cần nhập nội dung và điểm');S.cat.push({id:uid(),t,n:v[0],p,sev:0});save();vCD();toast('Đã thêm')})}
function auto(){const k=+$('#nto').value;if(!(k>0))return toast('Hãy nhập số tổ');if(!S.st.length)return toast('Chưa có học sinh');S.st.forEach((s,i)=>s.to=Math.floor(i*k/S.st.length)+1);save();vCD();toast('Đã chia '+S.st.length+' học sinh thành '+k+' tổ')}
function shortLink(){const m=FB.match(/^https:\/\/(.+)-default-rtdb\.(?:(.+)\.firebasedatabase\.app|firebaseio\.com)\/(.+)$/);return location.origin+location.pathname+'?'+(m?'f='+m[1]+'~'+(m[2]||'us')+'~'+m[3]:'fb='+encodeURIComponent(FB))}
let QM=1,QU='';
function qrSvg(t){const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:4,scalable:true})}
function showLink(){QU=QM?shortLink():location.origin+location.pathname;
modal(`<b>Mã QR cho học sinh quét</b><div class="row noprint" style="margin:8px 0"><button class="${QM?'':'s'}" onclick="QM=1;showLink()">Lần đầu (kèm kết nối)</button><button class="${QM?'s':''}" onclick="QM=0;showLink()">Đã dùng rồi (chỉ địa chỉ)</button></div>
<div id=qrb style="background:#fff;padding:10px;border-radius:8px;width:280px;max-width:100%;margin:8px auto">${qrSvg(QU)}</div>
<p><small>${QM?'Mã này chứa <b>kết nối dữ liệu của lớp</b>: chỉ chiếu hoặc phát trong lớp, không chụp đăng lên nhóm công khai.':'Dùng cho điện thoại đã mở link “lần đầu” trước đó (máy đã nhớ kết nối).'}</small></p>
<input id=lk readonly style="width:100%" value="${esc(QU)}"><div class="row noprint" style="margin-top:8px"><button onclick="$('#lk').select();navigator.clipboard&&navigator.clipboard.writeText($('#lk').value);toast('Đã sao chép link')">Sao chép link</button><button class=s onclick=qrFull()>Phóng to để chiếu</button><button class=s onclick=window.print()>In</button><button class=s onclick="$('#mo').innerHTML=''">Đóng</button></div>`)}
function qrFull(){$('#mo').innerHTML=`<div class=mo onclick=showLink() style="background:#fff;align-items:center;cursor:zoom-out"><div style="width:min(88vmin,680px);margin:auto">${qrSvg(QU)}<p style="text-align:center;color:#000;font:16px sans-serif">Quét mã để mở công cụ · chạm để thu nhỏ</p></div></div>`}
function imp(f){const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}).map(r=>r.map(c=>String(c).trim()));
const hi=A.findIndex(r=>r.some(c=>/^tên$/i.test(c)||/họ và tên|họ tên/i.test(c)));if(hi<0)return toast('Không thấy dòng tiêu đề có cột “Tên” hoặc “Họ và tên”.');
const H=A[hi].map(c=>c.toLowerCase()),ix=fn=>H.findIndex(fn),cl=ix(c=>c.includes('lót')),ct=ix(c=>c=='tên'),cf=ix(c=>/họ và tên|họ tên/.test(c)),cd=ix(c=>c.includes('sinh')),cg=ix(c=>c=='nữ'||c.includes('giới'));
const l=A.slice(hi+1).map(r=>{let h,t;if(ct>=0){h=cl>=0?r[cl]:'';t=r[ct]}else{const p=(r[cf]||'').split(/\s+/);t=p.pop();h=p.join(' ')}return{id:uid(),h,t,d:cd>=0?r[cd]:'',g:cg>=0?r[cg]:'',to:'',r:'',ic:gen()}}).filter(x=>x.t);
if(!l.length)return toast('Không đọc được học sinh nào.');
const go=()=>{S.st=l;save();vCD();toast('Đã nạp '+l.length+' học sinh')};S.st.length?conf(`Nạp ${l.length} học sinh và THAY THẾ danh sách hiện tại?`,go):go()}catch(x){toast('Lỗi đọc file: '+x.message)}};r.readAsArrayBuffer(f.files[0])}
pull().then(render);render();
</script></body></html>
